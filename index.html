<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>作文小學堂</title>
  <link rel="manifest" href="wr-manifest.json">
  <meta name="theme-color" content="#ffe8c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作文小學堂">
  <link rel="apple-touch-icon" href="wr-icon-180.png">
  <link rel="icon" href="wr-icon-192.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink);
      background: repeating-linear-gradient(90deg, #ffe8c2 0 60px, #fff1d6 60px 110px, #fbdca5 110px 130px, #fff1d6 130px 180px);
      user-select: none; -webkit-user-select: none;
      padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);
    }
    button { font-family: inherit; cursor: pointer; }
    ruby rt { font-size: .42em; color: #b8431f; font-weight: 600; }
    body.nozy rt { display: none; }
    .screen { display: none; flex-direction: column; align-items: center; gap: 14px; min-height: calc(100vh - 28px); padding-top: 68px; position: relative; }
    .screen.active { display: flex; }
    .round-btn { position: absolute; top: 0; left: 0; z-index: 5; width: 60px; height: 60px; border-radius: 50%; border: 4px solid #fff; background: var(--orange); color: #fff; font-size: 28px; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
    .zy-btn { position: absolute; top: 4px; right: 0; z-index: 5; border: 3px solid #fff; background: #fff; color: var(--red); font-size: 18px; font-weight: bold; border-radius: 999px; padding: 8px 16px; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); color: #fff; background: var(--red); padding: 6px 26px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
    .ver { font-size: 13px; font-weight: 500; color: #ffe8d6; background: rgba(0,0,0,.18); border-radius: 9px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
    h2 { margin: 0; font-size: clamp(24px, 4vw, 36px); text-align: center; }
    .sub { font-size: 18px; color: #7a5a3a; text-align: center; }
    .big-btn { width: min(520px, 92vw); padding: 14px 16px; font-size: 26px; font-weight: bold; border: 5px solid var(--orange); border-radius: 20px; background: #fff3b8; color: #c2410c; box-shadow: 0 5px 0 #c8721a; }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c8721a; }
    .big-btn small { display: block; font-size: 16px; font-weight: normal; color: #8a6d3b; }
    .big-btn.done { border-color: var(--ok); background: #e6f8dc; color: #2c7a2c; box-shadow: 0 5px 0 #2f8a2f; }

    /* 書架 */
    .shelf { width: min(1000px, 96vw); }
    .shelf h3 { margin: 8px 4px; font-size: 22px; color: #a34a12; }
    .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .book { background: #fff; border: 5px solid #f3c27a; border-radius: 22px; box-shadow: 0 4px 0 #d79a43; padding: 8px 10px 10px; text-align: center; font-family: inherit; color: var(--ink); }
    .book:active { transform: translateY(3px); box-shadow: 0 1px 0 #d79a43; }
    .book .cv { font-size: 60px; line-height: 1.15; }
    .book .t { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
    .book .m { margin-top: 2px; font-size: 14px; color: #8a6d57; min-height: 18px; }
    .lvbtn { display: block; margin: 8px 0 0 4px; border: 3px solid var(--orange); background: #fff; color: #c2410c; font-weight: bold; font-size: 17px; border-radius: 999px; padding: 6px 16px; }

    /* 成語大標 */
    .idiom-title { font-size: clamp(44px, 9vw, 72px); font-weight: bold; color: var(--red); letter-spacing: 6px; text-align: center; line-height: 1.7; }
    .idiom-title ruby rt { font-size: .26em; letter-spacing: 0; }

    /* 故事 */
    .scene { container-type: inline-size; position: relative; width: min(900px, 96vw, max(320px, calc((100vh - 400px) * 16 / 9))); aspect-ratio: 16 / 9; border-radius: 26px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 5px 14px rgba(0,0,0,.22); }
    .bg-meadow { background: linear-gradient(#8fd3ff 0 60%, #a6e36a 60%); }
    .bg-forest { background: linear-gradient(#cdeed4 0 52%, #5faf5f 52%); }
    .bg-night { background: linear-gradient(#1b2a5a 0 62%, #2a3b78 62%); }
    .bg-pond { background: linear-gradient(#bfe8ff 0 42%, #5bb8e8 42%); }
    .bg-castle { background: linear-gradient(#e9dcff 0 60%, #b79be0 60%); }
    .bg-room { background: linear-gradient(#ffe9c7 0 64%, #e0b27a 64%); }
    .bg-city { background: linear-gradient(#bfe3ff 0 58%, #d9c9a8 58%); }
    .bg-gold { background: linear-gradient(#fff3b0 0 60%, #ffd966 60%); }
    .it { position: absolute; line-height: 1; transform-origin: 50% 80%; animation: popin .5s both; filter: drop-shadow(0 3px 2px rgba(0,0,0,.18)); }
    .it.bounce { animation: popin .5s both, bounce .9s .5s infinite alternate ease-in-out; }
    .it.sway { animation: popin .5s both, sway 1.6s .5s infinite alternate ease-in-out; }
    .it.float { animation: popin .5s both, float 2.4s .5s infinite alternate ease-in-out; }
    .it.run { animation: popin .5s both, run 1.3s .5s infinite alternate ease-in-out; }
    .it.spin { animation: popin .5s both, spin 3s .5s infinite linear; }
    @keyframes popin { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-9%); } }
    @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-12%); } }
    @keyframes run { from { transform: translateX(-14%); } to { transform: translateX(14%); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .sub-box { width: min(900px, 96vw); background: #fff; border: 5px solid #f3c27a; border-radius: 22px; padding: 12px 18px; font-size: clamp(24px, 4.2vw, 34px); line-height: 1.7; font-weight: 600; text-align: center; min-height: 96px; }
    /* 卡拉OK：還沒唸的字是深色，唸過的字變橘紅色，正在唸的字有底色 */
    .sub-box .c { transition: color .12s, background .12s; border-radius: 6px; }
    .sub-box .c.done { color: var(--red); }
    .sub-box .c.now { color: #fff; background: var(--red); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .pill { border: 4px solid var(--orange); background: #fff3b8; color: #c2410c; font-size: 22px; font-weight: bold; border-radius: 999px; padding: 10px 22px; box-shadow: 0 4px 0 #c8721a; }
    .pill:active { transform: translateY(3px); box-shadow: 0 1px 0 #c8721a; }
    .pill.main { background: var(--orange); border-color: #fff; color: #fff; }
    .pill[disabled] { opacity: .4; }
    .dots { font-size: 20px; letter-spacing: 6px; color: var(--orange); }

    body.nozy rt { display: none; }
    h3.lv { margin: 12px 4px 6px; font-size: 22px; color: #a34a12; }
    h3.lv small { font-size: 15px; font-weight: normal; color: #8a6d57; margin-left: 8px; }
    .les-title { font-size: clamp(30px, 6vw, 48px); font-weight: bold; color: var(--red); text-align: center; line-height: 1.4; }
    .hub-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; width: min(760px, 94vw); }
    .hub-btns .big-btn { width: 100%; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(900px, 96vw); }
    .panels .scene { width: 100%; border-width: 4px; border-radius: 18px; }
    .panels .scene .no { position: absolute; left: 6px; top: 4px; z-index: 3; background: var(--red); color: #fff; font-weight: bold; border-radius: 999px; padding: 0 10px; font-size: 5cqw; }
    .one-scene { width: min(560px, 90vw); }
    .sub-box { text-align: left; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.9; }
    .sub-box.big { text-align: center; font-size: clamp(26px, 4.6vw, 38px); }
    .card { width: min(900px, 96vw); background: #fff; border: 5px solid #f3c27a; border-radius: 22px; padding: 12px 18px; }
    .card h4 { margin: 0 0 6px; font-size: 24px; color: #a34a12; }
    .card p { margin: 4px 0; font-size: 22px; line-height: 1.7; }
    .say { border: 0; background: var(--orange); color: #fff; border-radius: 999px; min-width: 44px; height: 44px; font-size: 20px; flex: none; padding: 0 10px; }
    .rowl { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 2px dashed #f3dfb7; font-size: 22px; line-height: 1.7; }
    .rowl:last-child { border-bottom: 0; }
    .rowl .kbox { flex: 1; }
    .rowl .kbox .c.done { color: var(--red); }
    .rowl .kbox .c.now { color: #fff; background: var(--red); border-radius: 6px; }
    .eg { color: #6b4a2b; }
    .dots { font-size: 26px; letter-spacing: 6px; color: var(--orange); }
    .hint { font-size: 20px; color: #7a5a3a; text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(900px, 96vw); }
    .chip { border: 3px solid var(--orange); background: #fff; color: #c2410c; font-weight: bold; font-size: 20px; border-radius: 999px; padding: 6px 14px; }
    .chip:active { background: #fff3b8; }
    textarea { width: min(900px, 96vw); min-height: 150px; border: 5px solid #f3c27a; border-radius: 20px; padding: 12px 16px; font-size: 26px; line-height: 1.7; font-family: inherit; color: var(--ink); background: #fff; user-select: text; -webkit-user-select: text; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--orange); }
    .peek { width: min(900px, 96vw); background: #fffbe8; border: 3px dashed #e8b762; border-radius: 16px; padding: 8px 14px; font-size: 20px; line-height: 1.7; color: #6b4a2b; }
    .cks { width: min(900px, 96vw); display: grid; gap: 8px; }
    .ck { display: flex; align-items: center; gap: 12px; background: #fff; border: 4px solid #f3c27a; border-radius: 16px; padding: 10px 14px; font-size: 22px; font-weight: 600; text-align: left; color: var(--ink); }
    .ck .b { width: 34px; height: 34px; border-radius: 8px; border: 3px solid var(--orange); background: #fff; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
    .ck.on { border-color: var(--ok); background: #e6f8dc; }
    .ck.on .b { background: var(--ok); border-color: var(--ok); }
    .msg { min-height: 34px; font-size: 24px; font-weight: bold; color: #2c7a2c; text-align: center; }
    .bq { font-size: clamp(24px, 4.4vw, 34px); font-weight: bold; text-align: center; }
    .bopts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: min(900px, 96vw); }
    .bopt { border: 5px solid var(--orange); background: #fff3b8; border-radius: 22px; padding: 10px 18px; font-size: 28px; font-weight: bold; color: #c2410c; box-shadow: 0 4px 0 #c8721a; }
    .bopt .e { display: block; font-size: 52px; line-height: 1.2; }
    .bopt:active { transform: translateY(3px); box-shadow: 0 1px 0 #c8721a; }
    .picks { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 74px; }
    .pk { border: 4px solid var(--ok); background: #e6f8dc; border-radius: 18px; padding: 4px 14px; font-size: 34px; color: #2c7a2c; font-weight: bold; }
    .work { width: min(900px, 96vw); background: #fff; border: 5px solid #f3c27a; border-radius: 22px; padding: 12px 18px; }
    .work h4 { margin: 0 0 4px; font-size: 24px; color: #a34a12; }
    .work .d { font-size: 15px; color: #8a6d57; }
    .work .txt { font-size: 22px; line-height: 1.8; margin: 6px 0; }
    .work .txt .c.done { color: var(--red); }
    .work .txt .c.now { color: #fff; background: var(--red); border-radius: 6px; }
    /* 稿紙：直式、由右往左、一格一字（標點也占一格） */
    .gz { --cell: clamp(22px, calc((100vh - 250px) / var(--rows, 20)), 40px); direction: rtl; display: flex; overflow-x: auto; background: #fffdf5; border: 5px solid #e8b05a; border-radius: 14px; padding: 8px; width: min(96vw, 1000px); max-width: 100%; user-select: none; }
    .gz.small { --cell: clamp(30px, 7vw, 46px); width: auto; max-width: 96vw; }
    .gcol { direction: ltr; display: flex; flex-direction: column; flex: none; }
    .gc { position: relative; width: var(--cell); height: var(--cell); border: 1px solid #e9b87a; margin: 0 -1px -1px 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .7); line-height: 1; color: var(--ink); font-weight: 500; }
    .gc .c { writing-mode: vertical-rl; border-radius: 4px; }
    .gc .pn { width: .62em; height: .62em; display: block; }
    .gc.qo { align-items: flex-start; }
    .gc.qc { align-items: flex-end; }
    .gc .c.x { position: absolute; right: 4%; bottom: 4%; font-size: .7em; }
    .gc .c.x .pn { width: .5em; height: .5em; }
    .gc .c.x0 { position: absolute; right: 2%; bottom: -6%; font-size: .8em; }
    .gc .c.done { color: var(--red); }
    .gc .c.now { color: #fff; background: var(--red); }
    .gc.ttl { color: #a34a12; font-weight: bold; }
    .iss { width: min(900px, 96vw); background: #fffbe8; border: 3px dashed #e8b762; border-radius: 16px; padding: 8px 14px; font-size: 20px; line-height: 1.7; text-align: left; }
    .iss b { color: var(--red); background: #ffe3d6; border-radius: 6px; padding: 0 4px; }
    .iss .k { font-weight: bold; color: #a34a12; }
    .iss + .iss { margin-top: -6px; }
    .iss .chip { margin-top: 4px; }
    .sentence { font-size: clamp(30px, 6vw, 52px); font-weight: bold; text-align: center; line-height: 1.8; letter-spacing: 4px; }
    .sentence .bl { display: inline-block; min-width: 1.1em; border-bottom: 5px solid #e8b05a; color: #bbb; margin: 0 4px; }
    .sentence .bl.on { border-color: var(--red); animation: pulse .9s infinite; }
    .sentence .bl.ok { color: var(--ok); border-color: var(--ok); }
    .popt { min-width: 84px; border: 5px solid var(--orange); background: #fff3b8; border-radius: 20px; font-size: 44px; font-weight: bold; color: #c2410c; padding: 4px 18px; box-shadow: 0 4px 0 #c8721a; }
    .popt.bad { opacity: .35; animation: shake .35s; }
    .popt.glow { animation: pulse .9s infinite; border-color: var(--ok); }
    .pcards { display: flex; flex-direction: column; gap: 14px; width: min(940px, 96vw); }
    .pcard { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; background: #fff; border: 5px solid #f3c27a; border-radius: 24px; padding: 10px; }
    .pcard .scene { width: min(400px, 88vw); flex: none; border-width: 4px; }
    .pcard .ptxt { flex: 1; min-width: 260px; display: flex; gap: 10px; align-items: flex-start; }
    .pcard .say { min-width: 56px; height: 56px; font-size: 28px; }
    .hz { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.9; text-align: left; font-weight: 500; }
    .hz .c { border-radius: 6px; transition: color .12s, background .12s; }
    .hz .c.done { color: var(--red); }
    .hz .c.now { color: #fff; background: var(--red); }
    .picrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(960px, 96vw); }
    .picrow .scene { width: min(228px, 44vw); border-width: 3px; border-radius: 14px; }
    .work .picrow .scene { width: min(150px, 30vw); }
    h4.cat { margin: 10px 8px 4px; font-size: 20px; color: #b8431f; border-left: 8px solid var(--orange); padding-left: 8px; }
    .work .row .pill { font-size: 18px; padding: 6px 14px; }
  </style>
</head>
<body>

<!-- 首頁 -->
<div class="screen active" id="home">
  <h1>✏️ 作文小學堂 <span class="ver" id="ver"></span></h1>
  <div class="sub">每天寫一點點，就會越寫越好 ✨</div>
  <button class="big-btn" data-go="works">📒 我的作品<small id="worksN"></small></button>
  <div class="shelf" id="shelf"></div>
</div>

<!-- 課程主頁 -->
<div class="screen" id="hub">
  <button class="round-btn" data-go="home">⬅️</button>
  <div class="les-title" id="hbTitle"></div>
  <div class="sub" id="hbSub"></div>
  <div class="hub-btns">
    <button class="big-btn" id="bModel">👀 看範文<small>先看一篇範文</small></button>
    <button class="big-btn" id="bLearn">💡 學一學<small>學一個寫作的小技巧</small></button>
    <button class="big-btn" id="bWrite">✍️ 寫一寫<small>一步一步寫</small></button>
    <button class="big-btn" id="bRead">🎤 讀一讀<small>念自己的作文、存起來</small></button>
  </div>
</div>

<!-- 看範文 -->
<div class="screen" id="model">
  <button class="round-btn" data-go="hub">⬅️</button>
  <h2 id="mdTitle"></h2>
  <div class="sub">按喇叭 🔊，一段一段念給你聽</div>
  <div class="pcards" id="mdCards"></div>
  <div class="sub">📄 稿紙版（直式）</div>
  <div class="gz" id="mdBox"></div>
  <div class="row"><button class="pill" id="mdPlay">🔊 念全文</button></div>
</div>

<!-- 學一學 -->
<div class="screen" id="learn">
  <button class="round-btn" data-go="hub">⬅️</button>
  <h2 id="lnTitle"></h2>
  <div id="lnCards" style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%"></div>
</div>

<!-- 寫一寫 -->
<div class="screen" id="write">
  <button class="round-btn" data-go="hub">⬅️</button>
  <div class="dots" id="wrDots"></div>
  <div id="wrScene"></div>
  <h2 id="wrH"></h2>
  <div class="hint" id="wrHint"></div>
  <div class="chips" id="wrChips"></div>
  <textarea id="wrText" placeholder="寫在這裡～想不到也沒關係，先點上面的小提示"></textarea>
  <div class="row">
    <button class="pill" id="wrSay">🔊 念我寫的</button>
    <button class="pill" id="wrBreak">↵ 另起一段（空兩格）</button>
    <button class="pill" id="wrCheck">🔍 幫我檢查</button>
    <button class="pill" id="wrPeek">👀 偷看範文</button>
  </div>
  <div id="wrIssues" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px"></div>
  <div class="peek" id="wrModel" hidden></div>
  <div class="sub">📄 我的稿紙（直式，一格一個字）</div>
  <div class="gz" id="wrPaper"></div>
  <div class="row">
    <button class="pill" id="wrPrev">◀ 上一步</button>
    <button class="pill" id="wrNext">下一步 ▶</button>
  </div>
</div>

<!-- 讀一讀 -->
<div class="screen" id="done">
  <button class="round-btn" data-go="hub">⬅️</button>
  <h2 id="dnTitle"></h2>
  <div class="picrow" id="dnPics"></div>
  <div class="gz" id="dnBox"></div>
  <div class="row"><button class="pill" id="dnPlay">🔊 念我的作文</button></div>
  <div class="sub" id="dnCkT">看看自己做到了哪些？（點一點打勾）</div>
  <div class="cks" id="dnChecks"></div>
  <div class="row"><button class="pill" id="dnCheck">🔍 幫我檢查錯字和標點</button></div>
  <div id="dnIssues" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px"></div>
  <div class="msg" id="dnMsg"></div>
  <div class="row">
    <button class="pill" data-go="write">✍️ 回去修改</button>
    <button class="pill" id="dnSave">⭐ 存到我的作品</button>
  </div>
</div>

<!-- 點選拼句 -->
<div class="screen" id="build">
  <button class="round-btn" data-go="home">⬅️</button>
  <div class="les-title" id="bdTitle"></div>
  <div class="picks" id="bdPicks"></div>
  <div class="bq" id="bdQ"></div>
  <div class="bopts" id="bdOpts"></div>
  <div class="gz small" id="bdBox" hidden></div>
  <div class="msg" id="bdMsg"></div>
  <div class="row" id="bdBtns" hidden>
    <button class="pill" id="bdPlay">🔊 念給我聽</button>
    <button class="pill" id="bdSave">⭐ 存起來</button>
    <button class="pill" id="bdAgain">🔄 再玩一次</button>
  </div>

<script src="data.js"></script>

<script>
const APP_VER = 'v2026.11.06-7';
document.getElementById('ver').textContent = APP_VER;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
// ---------- 聲音 ----------
let AC = null;
function chime() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [659, 784, 988].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .11;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .4);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .45);
    });
  } catch (_) {}
}
const PRAISE = ['好棒！', '做得好！', '答對了！', '你好厲害！', '太棒了！'];
const TRY = ['再試試看～', '沒關係，再看看～', '慢慢來，再試一次～'];

let voice = null;
function pickVoice() { const v = speechSynthesis.getVoices(); voice = v.find(x => /zh[-_]TW/i.test(x.lang)) || v.find(x => /^zh/i.test(x.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// ---------- 卡拉OK：字一個一個掃過 ----------
let karTimer = null, karToken = 0;
function karStop() { karToken++; clearInterval(karTimer); karTimer = null; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
let karPos = 0;
const PUNC = /[「」『』“”‘’"'（）()《》〈〉【】—─…，。！？；：、,.!?;:~～]/;
// 唸出聲的文字：拿掉標點和引號（字幕還是照原來的字掃），並記下每個字對應字幕的第幾個字
function spoken(t) { let out = '', map = []; Array.from(t).forEach((c, i) => { if (!PUNC.test(c)) { out += c; map.push(i); } }); return { out, map }; }
function karShow(box, n) { karPos = n; box.querySelectorAll('.c').forEach((w, i) => { w.classList.toggle('done', i < n); w.classList.toggle('now', i === n); }); }
let msPerChar = 300;   // 每個字大約唸幾毫秒：每唸完一句就用實際時間修正
function karSay(text, box, onEnd, from = 0) {   // 一個分句一個分句唸；每句唸完字幕就對齊句尾，不會越差越多
  karStop();
  const my = karToken, cs = box ? [...box.querySelectorAll('.c')] : [];
  const clauses = (text.match(/[^，。！？；：、]+[，。！？；：、]*/g) || [text]).map(t => Array.from(t).length);
  let ci = 0, base = 0;
  const finish = () => { if (my !== karToken) return; clearInterval(karTimer); if (box) karShow(box, 999); if (onEnd) onEnd(); };
  if (!('speechSynthesis' in window)) { box ? fakeAll() : finish(); return; }
  const clauseText = [], arr = Array.from(text); let pos = 0;
  clauses.forEach(n => { clauseText.push(arr.slice(pos, pos + n).join('')); pos += n; });
  while (ci < clauses.length && base + clauses[ci] <= from) { base += clauses[ci]; ci++; }   // 從暫停的那一句開頭接著唸
  next();
  function next() {
    if (my !== karToken) return;
    if (ci >= clauses.length) { finish(); return; }
    const n = clauses[ci], start = base, t = clauseText[ci];
    let gotB = false, t0 = 0;
    if (box) karShow(box, start);
    const sp = spoken(t); if (!sp.out) { base = start + n; ci++; next(); return; }
    const u = new SpeechSynthesisUtterance(sp.out); u.lang = 'zh-TW'; u.rate = .72; u.pitch = 1.1; if (voice) u.voice = voice;
    u.onstart = () => {
      t0 = performance.now(); clearInterval(karTimer);
      if (!box) return;
      karTimer = setInterval(() => {   // 語音沒回報位置時，照預估速度掃，但不會超過這一句的最後一個字
        if (my !== karToken) { clearInterval(karTimer); return; }
        if (gotB) return;
        const k = Math.min(n - 1, Math.floor((performance.now() - t0) / msPerChar));
        karShow(box, start + k);
      }, 50);
    };
    u.onboundary = e => { if (my !== karToken || !box) return; gotB = true; karShow(box, start + Math.min(n - 1, sp.map[Math.min(sp.map.length - 1, e.charIndex)] || 0)); };
    const done = () => {
      if (my !== karToken) return;
      clearInterval(karTimer);
      if (t0) { const per = (performance.now() - t0) / n; if (per > 80 && per < 900) msPerChar = msPerChar * .5 + per * .5; }
      base = start + n; ci++; next();
    };
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  }
  function fakeAll() {
    const t0 = performance.now(), total = arr.length * msPerChar;
    karTimer = setInterval(() => { const f = (performance.now() - t0) / total; karShow(box, Math.min(cs.length, Math.floor(f * cs.length))); if (f >= 1) finish(); }, 60);
  }
}
const sayPlain = t => { karStop(); if (!('speechSynthesis' in window)) return; const u = new SpeechSynthesisUtterance(spoken(t).out); u.lang = 'zh-TW'; u.rate = .8; if (voice) u.voice = voice; speechSynthesis.speak(u); };
const kChars = t => Array.from(t).map(c => `<span class="c">${esc(c)}</span>`).join('');
LESSONS.forEach((l, i) => l.id = i);

// ---------- 稿紙排版（教育部作文格式：直書、由右到左、一格一字、標點占一格、每段開頭空兩格）----------
const OPEN_P = '「『（《〈【', CLOSE_P = '，。、；：？！」』）》〉】…—';
function layoutGrid(title, ps, o = {}) {
  const rows = o.rows || 20, minCols = o.minCols || 8, cols = []; let col = [];
  const flush = () => { while (col.length && col.length < rows) col.push({ k: 'b' }); if (col.length) { cols.push(col); col = []; } };
  const push = cell => { col.push(cell); if (col.length === rows) { cols.push(col); col = []; } };
  if (title) {   // 題目寫在第一行，置中
    const t = Array.from(title).slice(0, rows), pad = Math.floor((rows - t.length) / 2);
    for (let i = 0; i < pad; i++) push({ k: 'b' });
    t.forEach(c => push({ k: 't', c }));
    flush();
  }
  ps.flatMap(p => String(p).split(/\n+/)).map(p => p.trim()).filter(Boolean).forEach(p => {   // 孩子在輸入框按 Enter 換行，就是新的一段
    flush(); push({ k: 'b' }); push({ k: 'b' });   // 每段開頭空兩格
    Array.from(p).forEach(c => {
      if (CLOSE_P.includes(c) && col.length === 0 && cols.length) { const last = cols[cols.length - 1]; last[rows - 1].x = c; return; }   // 標點不放在行首：擠到上一行最後一格
      if (OPEN_P.includes(c) && col.length === rows - 1) push({ k: 'b' });                                                             // 前引號不放在行尾
      push({ k: 'c', c });
    });
  });
  flush();
  while (cols.length < minCols) cols.push(Array.from({ length: rows }, () => ({ k: 'b' })));
  const glyph = c => {   // 標點：句號、逗號、頓號用畫的，正好在格子正中間；上引號靠格子上方，下引號靠下方
    const sv = p => `<svg viewBox="0 0 10 10" class="pn" aria-label="${c}">${p}</svg>`;
    if (c === '。') return sv('<circle cx="5" cy="5" r="2.1" fill="none" stroke="currentColor" stroke-width="1"/>');
    if (c === '，') return sv('<circle cx="5" cy="4.6" r="1.4" fill="currentColor"/><path d="M5.3 5.4 Q5.5 7.4 3.8 8.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>');
    if (c === '、') return sv('<path d="M4 3.6 L6.2 6.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>');
    return esc(c);
  };
  const cls = c => c === '「' || c === '『' ? ' qo' : c === '」' || c === '』' ? ' qc' : '';
  const cell = x => x.k === 'b' ? '<span class="gc"></span>' : x.k === 't' ? `<span class="gc ttl">${esc(x.c)}</span>` : `<span class="gc${cls(x.c)}"><span class="c" data-ch="${esc(x.c)}">${glyph(x.c)}</span>${x.x ? `<span class="c x" data-ch="${esc(x.x)}">${glyph(x.x)}</span>` : ''}</span>`;
  return cols.map(c => `<div class="gcol">${c.map(cell).join('')}</div>`).join('');
}
const gridOf = (title, ps, o) => { document.documentElement.style.setProperty('--rows', (o && o.rows) || 20); return layoutGrid(title, ps, o); };
const plainTitle = t => { const i = t.indexOf(' '); return i > 0 ? t.slice(i + 1) : t; };
const _karShow = karShow;
karShow = function (box, n) { _karShow(box, n); const el = box.querySelectorAll('.c')[n]; if (el && el.scrollIntoView) { try { el.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (_) {} } };

// ---------- 讀出來：按一下開始，再按暫停，再按從那一句接著讀 ----------
let rd = { btn: null, st: '', pos: 0 };
function rdReset() { karStop(); if (rd.btn) rd.btn.textContent = rd.btn.dataset.idle || '🔊'; rd = { btn: null, st: '', pos: 0 }; }
function rdToggle(btn, box) {
  const text = Array.from(box.querySelectorAll('.c')).map(c => c.dataset.ch || c.textContent).join('');   // 稿紙裡的標點是畫的，字存在 data-ch
  if (!text) return;
  const idle = btn.dataset.idle || (btn.dataset.idle = btn.textContent);
  const long = idle.length > 2;
  if (rd.btn === btn && rd.st === 'play') { const p = karPos; karStop(); rd.pos = p; rd.st = 'pause'; btn.textContent = long ? '▶ 繼續' : '▶'; return; }
  const from = (rd.btn === btn && rd.st === 'pause') ? rd.pos : 0;
  if (rd.btn !== btn) { const old = rd.btn, ob = old && old._box; rdReset(); if (ob) karShow(ob, -1); } else karStop();
  rd = { btn, st: 'play', pos: from }; btn._box = box;
  btn.textContent = long ? '⏸ 暫停' : '⏸';
  karSay(text, box, () => { btn.textContent = idle; rd = { btn: null, st: '', pos: 0 }; }, from);
}
document.addEventListener('click', e => {
  const b = e.target.closest('.say'); if (!b) return;
  const box = b.parentElement.querySelector('.kbox'); if (box) rdToggle(b, box);
});

const prog = () => store.get('wrProg', {});
function mark(id, what) { const p = prog(); (p[id] = p[id] || {})[what] = 1; store.set('wrProg', p); }
const praise = () => { chime(); return pick(PRAISE); };
const paras = ps => ps.map(kChars).join('<br>');

// ---------- 畫面切換 ----------
let cur = null;
function show(id) {
  rdReset(); karStop();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
  if (id === 'home') renderHome();
  if (id === 'hub') renderHub();
  if (id === 'works') renderWorks();
  if (id === 'write') renderWrite();
  if (id === 'done') renderDone();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  show(g.dataset.go);
});

// ---------- 首頁 ----------
const sceneHTML = s => `<div class="scene ${'bg-' + s.bg}">${s.items.map(it => `<span class="it ${it.a}" style="left:${it.x}%;top:${it.y}%;font-size:${it.z}cqw">${it.e}</span>`).join('')}</div>`;
function renderHome() {
  const p = prog(); let h = '';
  LEVELS.forEach((lv, li) => {
    const book = l => { const n = Object.keys(p[l.id] || {}).length; return `<button class="book" data-l="${l.id}"><div class="cv">${l.em}</div><div class="t">${esc(l.t)}</div><div class="m">${esc(l.m)}</div><div class="m">${n ? '⭐'.repeat(n) : '　'}</div></button>`; };
    h += `<h3 class="lv">${lv.ic} ${esc(lv.n)}<small>${esc(lv.d)}</small></h3>`;
    const list = LESSONS.filter(l => l.lv === li), cats = [...new Set(list.map(l => l.cat).filter(Boolean))];
    if (cats.length) h += cats.map(c => `<h4 class="cat">${esc(c)}</h4><div class="books">${list.filter(l => l.cat === c).map(book).join('')}</div>`).join('');
    else h += '<div class="books">' + list.map(book).join('') + '</div>';
  });
  $('shelf').innerHTML = h;
  const w = store.get('wrWorks', []); $('worksN').textContent = w.length ? `已經存了 ${w.length} 篇` : '還沒有作品，來寫第一篇吧！';
}
$('shelf').onclick = e => {
  const b = e.target.closest('.book'); if (!b) return;
  cur = LESSONS[+b.dataset.l];
  cur.kind === 'build' ? startBuild() : cur.kind === 'punct' ? startPunct() : show('hub');
};

// ---------- 課程主頁 ----------
function renderHub() {
  const p = prog()[cur.id] || {};
  $('hbTitle').textContent = cur.em + ' ' + cur.t;
  $('hbSub').textContent = LEVELS[cur.lv].n + '：' + cur.m;
  [['bModel', 'model'], ['bLearn', 'learn'], ['bWrite', 'write'], ['bRead', 'read']].forEach(([b, k]) => $(b).classList.toggle('done', !!p[k]));
}
$('bModel').onclick = () => { mark(cur.id, 'model'); renderModel(); show('model'); };
$('bLearn').onclick = () => { mark(cur.id, 'learn'); renderLearn(); show('learn'); };
$('bWrite').onclick = () => { wStep = 0; show('write'); };
$('bRead').onclick = () => show('done');

// ---------- 看範文 ----------
function renderModel() {
  $('mdTitle').textContent = cur.t + '（範文）';
  $('mdCards').innerHTML = cur.model.map((p, i) => `<div class="pcard">${cur.pics && cur.pics[i] ? sceneHTML(cur.pics[i]) : ''}<div class="ptxt"><button class="say">🔊</button><div class="kbox hz">${kChars(p)}</div></div></div>`).join('');
  $('mdBox').innerHTML = gridOf(cur.t, cur.model);
  const b = $('mdPlay'); b.textContent = '🔊 念全文'; b.dataset.idle = '🔊 念全文';
}
$('mdPlay').onclick = () => rdToggle($('mdPlay'), $('mdBox'));
const picsHTML = l => l && l.pics ? l.pics.map(sceneHTML).join('') : '';

// ---------- 學一學 ----------
function renderLearn() {
  $('lnTitle').textContent = '💡 ' + cur.t + '：學一學';
  $('lnCards').innerHTML = cur.learn.map(([t, d, ex]) =>
    `<div class="card"><h4>${esc(t)}</h4>
       <div class="rowl"><button class="say">🔊</button><div class="kbox">${kChars(d)}</div></div>` +
    ex.map(x => `<div class="rowl eg"><button class="say">🔊</button><div class="kbox">${kChars(x)}</div></div>`).join('') + '</div>').join('');
}

// ---------- 寫一寫 ----------
let wStep = 0;
const draftKey = () => 'wrDraft' + cur.id;
const getDraft = () => store.get(draftKey(), []);
function setDraftAt(i, v) { const d = getDraft(); d[i] = v; store.set(draftKey(), d); }
function renderWrite() {
  const st = cur.steps[wStep], n = cur.steps.length;
  $('wrDots').textContent = cur.steps.map((_, i) => i < wStep ? '●' : i === wStep ? '◉' : '○').join(' ');
  $('wrScene').innerHTML = cur.panels ? sceneHTML(cur.panels[wStep]).replace('class="scene', 'class="scene one-scene') : '';
  $('wrH').textContent = `${wStep + 1}／${n}　${st.h}`;
  $('wrHint').textContent = st.hint;
  $('wrChips').innerHTML = st.starters.map(s => `<button class="chip">${esc(s)}</button>`).join('');
  $('wrText').value = getDraft()[wStep] || '';
  $('wrModel').hidden = true; $('wrModel').textContent = cur.model.join('\n'); $('wrModel').style.whiteSpace = 'pre-wrap';
  $('wrPrev').style.visibility = wStep ? 'visible' : 'hidden';
  $('wrNext').textContent = wStep === n - 1 ? '寫完了 ✔' : '下一步 ▶';
  $('wrIssues').innerHTML = '';
  renderPaper();
}
// 稿紙的段落：一句話日記、看圖寫短文的每一步會接成同一段，孩子自己按「另起一段」才分段；國小中高年級、國中每一步各自一段
function paraList() {
  const d = getDraft(), out = []; let curP = '';
  cur.steps.forEach((_, i) => {
    const raw = d[i] || '', segs = raw.split(/\n+/).map(x => x.trim());
    segs.forEach((seg, k) => {
      if (cur.lv > 2 && k === 0 && curP) { out.push(curP); curP = ''; }
      if (k > 0 && curP) { out.push(curP); curP = ''; }
      curP += seg;
    });
    if (cur.lv > 2 || /\n\s*$/.test(raw)) { if (curP) out.push(curP); curP = ''; }
  });
  if (curP) out.push(curP);
  return out.filter(Boolean);
}
function renderPaper() { $('wrPaper').innerHTML = gridOf(cur.t, paraList()); }
$('wrChips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; const t = $('wrText'); t.value += c.textContent; setDraftAt(wStep, t.value); renderPaper(); t.focus(); };
$('wrText').oninput = () => { setDraftAt(wStep, $('wrText').value); renderPaper(); };
$('wrSay').onclick = () => { const t = $('wrText').value.trim(); if (t) sayPlain(t); };
$('wrBreak').onclick = () => { const t = $('wrText'); if (t.value && !/\n$/.test(t.value)) t.value += '\n'; setDraftAt(wStep, t.value); renderPaper(); t.focus(); };
$('wrPeek').onclick = () => { $('wrModel').hidden = !$('wrModel').hidden; };
$('wrPrev').onclick = () => { if (wStep > 0) { wStep--; renderWrite(); window.scrollTo(0, 0); } };
$('wrNext').onclick = () => {
  mark(cur.id, 'write');
  if (wStep < cur.steps.length - 1) { wStep++; chime(); renderWrite(); window.scrollTo(0, 0); } else show('done');
};

// ---------- 讀一讀 ----------
const composed = () => paraList();
function renderDone() {
  $('dnTitle').textContent = cur.em + ' ' + cur.t;
  const ps = composed();
  $('dnBox').innerHTML = ps.length ? gridOf(cur.t, ps) : '<div style="direction:ltr;padding:12px;font-size:22px;line-height:1.8">你還沒寫喔，先去「寫一寫」，想不到也沒關係，點提示就能開始！</div>';
  $('dnIssues').innerHTML = '';
  $('dnPics').innerHTML = ps.length ? picsHTML(cur) : '';
  $('dnPlay').textContent = '🔊 念我的作文'; $('dnPlay').dataset.idle = '🔊 念我的作文';
  $('dnPlay').style.display = ps.length ? '' : 'none';
  $('dnChecks').innerHTML = cur.check.map(c => `<button class="ck"><span class="b">✓</span>${esc(c)}</button>`).join('');
  $('dnCkT').style.display = ps.length ? '' : 'none'; $('dnChecks').style.display = ps.length ? '' : 'none';
  $('dnSave').style.display = ps.length ? '' : 'none';
  $('dnMsg').textContent = '';
}
$('dnPlay').onclick = () => { mark(cur.id, 'read'); rdToggle($('dnPlay'), $('dnBox')); };
$('dnChecks').onclick = e => {
  const c = e.target.closest('.ck'); if (!c) return;
  c.classList.toggle('on');
  const all = [...document.querySelectorAll('#dnChecks .ck')];
  const n = all.filter(x => x.classList.contains('on')).length;
  $('dnMsg').textContent = n === all.length ? praise() + ' 全部都做到了！' : n ? '很好，你做到 ' + n + ' 項了！' : '';
};
function saveWork(title, text, ref) {
  const w = store.get('wrWorks', []);
  const i = w.findIndex(x => x.ref === ref);
  const item = { ref, title, text, date: new Date().toLocaleDateString('zh-TW') };
  if (i >= 0) w[i] = item; else w.unshift(item);
  store.set('wrWorks', w);
}
$('dnSave').onclick = () => {
  const ps = composed(); if (!ps.length) return;
  saveWork(cur.em + ' ' + cur.t, ps, 'L' + cur.id);
  mark(cur.id, 'save'); $('dnMsg').textContent = praise() + ' 已經存到「我的作品」了！';
};

// ---------- 錯字與標點的小提醒 ----------
const KIND = { typo: '✏️ 錯字小提醒', punct: '🔹 標點小提醒', hint: '💡 小建議' };
function showIssues(box, items, after) {   // items: [{step, text}]
  const all = [];
  items.forEach(({ step, text }) => checkText(text).forEach(it => all.push({ ...it, step, text })));
  if (!all.length) { box.innerHTML = '<div class="iss">🎉 太棒了！我沒有發現需要修改的地方。<br><small>（我只能找出常見的錯字和標點，最後還是請大人幫你看一看喔）</small></div>'; return; }
  box.innerHTML = `<div class="msg">我發現 ${all.length} 個可以變得更棒的地方：</div>` + all.map((it, i) => {
    const t = it.text, a = it.s, b = it.e;
    const ctx = esc(t.slice(Math.max(0, a - 6), a)) + (it.kind === 'hint' ? '' : `<b>${esc(it.found)}</b>`) + esc(t.slice(b, b + 6));
    return `<div class="iss"><span class="k">${KIND[it.kind]}</span>${items.length > 1 ? `（第 ${it.step + 1} 段）` : ''}<br>${it.kind === 'hint' ? esc(it.found) + '…' : '…' + ctx + '…'}<br>${esc(it.why)}` +
      (it.fix != null ? `<br><button class="chip" data-i="${i}">${it.fix ? '改成「' + esc(it.fix) + '」' : '把它拿掉'}</button>` : '') + '</div>';
  }).join('');
  box.onclick = e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const it = all[+c.dataset.i], d = getDraft();
    d[it.step] = applyFix(d[it.step] || '', it); store.set(draftKey(), d); chime(); after();
  };
}
$('wrCheck').onclick = () => { mark(cur.id, 'check'); const t = $('wrText').value; showIssues($('wrIssues'), [{ step: wStep, text: t }], () => { $('wrText').value = getDraft()[wStep] || ''; renderPaper(); $('wrCheck').click(); }); };
$('dnCheck').onclick = () => {
  const d = getDraft(); const items = cur.steps.map((_, i) => ({ step: i, text: d[i] || '' })).filter(x => x.text.trim());
  showIssues($('dnIssues'), items, () => { renderDone(); $('dnCheck').click(); });
};

// ---------- 標點小老師 ----------
const PUNCS = '。，？！：「」';
let pc = null;
const pcBlanks = it => it.filter(t => PUNCS.includes(t));
function startPunct() { pc = { i: 0, k: 0, miss: 0 }; $('pcTitle').textContent = cur.em + ' ' + cur.t; $('pcIntro').innerHTML = '<h4>先認識它</h4>' + cur.intro.map(([p, d]) => `<div class="rowl"><b style="font-size:40px;color:var(--red);min-width:64px;text-align:center">${esc(p)}</b><div>${esc(d)}</div></div>`).join(''); show('punct'); renderPunct(); }
function renderPunct() {
  const it = cur.items[pc.i], bl = pcBlanks(it); let b = 0;
  $('pcDots').textContent = cur.items.map((_, i) => i < pc.i ? '●' : i === pc.i ? '◉' : '○').join(' ');
  $('pcSent').innerHTML = it.map(t => { if (!PUNCS.includes(t)) return esc(t); const n = b++; return n < pc.k ? `<span class="bl ok">${esc(t)}</span>` : `<span class="bl${n === pc.k ? ' on' : ''}">＿</span>`; }).join('');
  const done = pc.k >= bl.length, exp = bl[pc.k];
  $('pcOpts').innerHTML = done ? '' : cur.opts.map(o => `<button class="popt${pc.miss >= 2 && o === exp ? ' glow' : ''}" data-p="${esc(o)}">${esc(o)}</button>`).join('');
  $('pcNext').hidden = !done; $('pcNext').textContent = pc.i === cur.items.length - 1 ? '完成 ✔' : '下一題 ▶';
}
$('pcOpts').onclick = e => {
  const b = e.target.closest('.popt'); if (!b) return;
  const it = cur.items[pc.i], bl = pcBlanks(it), exp = bl[pc.k];
  if (b.dataset.p === exp) {
    pc.k++; pc.miss = 0; chime(); renderPunct();
    if (pc.k >= bl.length) { $('pcMsg').textContent = praise() + ' 這句話完成了！'; sayPlain(it.join('')); mark(cur.id, 'write'); }
    else $('pcMsg').textContent = '';
  } else { pc.miss++; b.classList.add('bad'); $('pcMsg').textContent = pick(TRY); if (pc.miss >= 2) renderPunct(); }
};
$('pcNext').onclick = () => {
  $('pcMsg').textContent = '';
  if (pc.i < cur.items.length - 1) { pc.i++; pc.k = 0; pc.miss = 0; renderPunct(); }
  else { mark(cur.id, 'read'); $('pcMsg').textContent = praise() + ' 全部完成了，你好棒！'; $('pcNext').hidden = true; $('pcOpts').innerHTML = ''; }
};

// ---------- 點選拼句 ----------
let bd = null;
function startBuild() { bd = { picks: [], more: null }; $('bdTitle').textContent = cur.em + ' ' + cur.t; show('build'); renderBuild(); }
function renderBuild() {
  const slots = cur.slots, k = bd.picks.length;
  $('bdPicks').innerHTML = bd.picks.map((p, i) => `<button class="pk" data-i="${i}">${p[0]} ${esc(p[1])}</button>`).join('') + (bd.more ? `<button class="pk" data-i="m">${bd.more[0]} ${esc(bd.more[1])}</button>` : '');
  const finishedMain = k >= slots.length, q = finishedMain ? cur.more : slots[k];
  const isDone = finishedMain && bd.more;
  $('bdQ').textContent = isDone ? '' : (finishedMain ? '再加一句：' : '') + q.q;
  $('bdOpts').innerHTML = isDone ? '' : q.o.map((o, i) => `<button class="bopt" data-o="${i}"><span class="e">${o[0]}</span>${esc(o[1])}</button>`).join('');
  const main = bd.picks.map((p, i) => p[1] + (slots[i].p || '')).join('');
  if (finishedMain) { $('bdBox').hidden = false; $('bdBox').innerHTML = gridOf('', [main + (bd.more ? bd.more[1] : '')], { rows: 8, minCols: 4 }); }
  else $('bdBox').hidden = true;
  $('bdBtns').hidden = !finishedMain;
  $('bdMsg').textContent = '';
  $('bdPlay').textContent = '🔊 念給我聽'; $('bdPlay').dataset.idle = '🔊 念給我聽';
}
$('bdOpts').onclick = e => {
  const b = e.target.closest('.bopt'); if (!b) return;
  const slots = cur.slots, o = +b.dataset.o;
  if (bd.picks.length < slots.length) bd.picks.push(slots[bd.picks.length].o[o]);
  else bd.more = cur.more.o[o];
  chime(); renderBuild();
  if (bd.picks.length >= slots.length) { rdReset(); sayPlain(builtText()); if (bd.more) { $('bdMsg').textContent = praise() + ' 你完成了一段話！'; mark(cur.id, 'write'); } }
};
const builtText = () => bd.picks.map((p, i) => p[1] + (cur.slots[i].p || '')).join('') + (bd.more ? bd.more[1] : '');
$('bdPicks').onclick = e => {
  const b = e.target.closest('.pk'); if (!b) return;
  if (b.dataset.i === 'm') bd.more = null; else { bd.picks = bd.picks.slice(0, +b.dataset.i); bd.more = null; }
  renderBuild();
};
$('bdPlay').onclick = () => { mark(cur.id, 'read'); rdToggle($('bdPlay'), $('bdBox')); };
$('bdSave').onclick = () => { saveWork(cur.em + ' ' + cur.t, [builtText()], 'B' + cur.id + '-' + Date.now()); $('bdMsg').textContent = praise() + ' 已經存起來了！'; };
$('bdAgain').onclick = () => { bd = { picks: [], more: null }; renderBuild(); };

// ---------- 我的作品 ----------
function renderWorks() {
  const w = store.get('wrWorks', []);
  $('wkList').innerHTML = w.length ? w.map((x, i) => `<div class="work"><h4>${esc(x.title)}</h4><div class="d">${esc(x.date)}</div>
    ${x.ref && x.ref[0] === 'L' && LESSONS[+x.ref.slice(1)] && LESSONS[+x.ref.slice(1)].pics ? `<div class="picrow">${picsHTML(LESSONS[+x.ref.slice(1)])}</div>` : ''}<div class="gz kbox">${gridOf(plainTitle(x.title), x.text)}</div>
    <div class="row"><button class="say" data-idle="🔊 念" >🔊 念</button><button class="pill" data-copy="${i}">📋 複製</button><button class="pill" data-del="${i}">🗑 刪除</button></div></div>`).join('')
    : '<div class="sub">還沒有作品。去寫一篇，按「存到我的作品」吧！</div>';
}
$('wkList').onclick = e => {
  const w = store.get('wrWorks', []);
  const c = e.target.closest('[data-copy]'), d = e.target.closest('[data-del]');
  if (c) { try { navigator.clipboard.writeText(w[+c.dataset.copy].text.join('\n')); c.textContent = '✓ 已複製'; } catch (_) {} }
  if (d) {
    if (d.dataset.sure) { w.splice(+d.dataset.del, 1); store.set('wrWorks', w); renderWorks(); }
    else { d.dataset.sure = 1; d.textContent = '再按一次就刪除'; setTimeout(() => { d.dataset.sure = ''; d.textContent = '🗑 刪除'; }, 3000); }
  }
};
// .say 在作品頁：按鈕和文字不在同一個父層，所以另外處理
document.addEventListener('click', e => {
  const b = e.target.closest('#wkList .say'); if (!b) return;
  e.stopImmediatePropagation();
  const box = b.closest('.work').querySelector('.kbox'); rdToggle(b, box);
}, true);

// ---------- 離線 ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
renderHome();
</script>
</body>
